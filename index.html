<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <!-- Stable production A-Frame library -->
    <script src="https://aframe.io"></script>
    <!-- Stable production AR.js library via official jsDelivr CDN -->
    <script src="https://jsdelivr.net"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <!-- Embedded AR scene with tracking UI enabled for debugging -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Tracks the Hiro marker -->
      <a-marker preset="hiro">
        <!-- Renders a cyan box that rotates -->
        <a-box position="0 0.5 0" material="color: cyan;" animation="property: rotation; to: 0 360 0; loop: true; dur: 2000"></a-box>
      </a-marker>
      
      
      
    </a-scene>
  </body>
</html>
