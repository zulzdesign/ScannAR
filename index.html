<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Include A-Frame for 3D graphics -->
    <script src="https://aframe.io"></script>
    <!-- Include AR.js for augmented reality tracking -->
    <script src="https://gcr.io"></script>
</head>

<body style="margin: 0px; overflow: hidden;">
    <!-- Setup the AR scene embedded in the web page -->
    <a-scene embedded arjs>
        <!-- Define the target marker (Hiro is a preset default) -->
        <a-marker preset="hiro">
            <!-- Define the 3D shape to show when the marker is seen -->
            <a-box position="0 0.5 0" material="color: cyan;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 2000"></a-box>
        </a-marker>
        <!-- Define the smartphone camera view -->
    </a-scene>
</body>

</html>
